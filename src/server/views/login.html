<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Otter Monitor · Đăng nhập quản trị</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    :root {
      --bg: #121721;
      --surface: #161c27;
      --elevated: #1c2331;
      --border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --soft: #94a3b8;
      --accent: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-size: 15px;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #14532d;
      border: 1px solid rgba(74, 222, 128, 0.4);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
    }
    h1 {
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      margin: 10px 0 24px;
    }
    .btn-google {
      width: 100%;
      background: #f8fafc;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn-google:hover { background: #ffffff; transform: translateY(-1px); }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .google-icon { width: 19px; height: 19px; }
    .alert {
      margin-top: 16px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      display: none;
      line-height: 1.45;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #fecaca;
    }
    .alert-success {
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(74, 222, 128, 0.4);
      color: #bbf7d0;
    }
    .footer-note {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--soft);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">
      <div class="brand-mark">OT</div>
      <div>
        <h1>Otter Monitor</h1>
        <div style="font-size: 12.5px; color: var(--soft);">Người dùng hoạt động &amp; Lượt tải</div>
      </div>
    </div>

    <p class="subtitle">
      Đăng nhập bằng tài khoản Google quản trị viên để xem danh sách người dùng đang online, thống kê lượt tải Otter và quản lý phiên bản phát hành.
    </p>

    <button type="button" class="btn-google" id="btnGoogleAuth" onclick="handleGoogleAdminLogin()">
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Đăng nhập bằng Google</span>
    </button>

    <div id="alertBox" class="alert"></div>

    <div class="footer-note">
      Chỉ các tài khoản trong danh sách quản trị viên Otter mới có quyền truy cập trang thống kê này.
    </div>
  </div>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBmRwlVmrO1qX6Og_2clEeD4dSH1k6Hdjc",
      authDomain: "otter-aeccc.firebaseapp.com",
      projectId: "otter-aeccc",
      storageBucket: "otter-aeccc.firebasestorage.app",
      messagingSenderId: "413906945210",
      appId: "1:413906945210:web:43656df9009fbe29476e83"
    };

    let fbAuth = null;
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(FIREBASE_CONFIG);
        fbAuth = firebase.auth();
      }
    } catch (e) {
      console.warn("Firebase Init Error:", e);
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
      box.textContent = msg;
      box.style.display = 'block';
    }

    async function handleGoogleAdminLogin() {
      const btn = document.getElementById('btnGoogleAuth');
      if (!fbAuth) {
        showAlert("Không thể khởi tạo dịch vụ xác thực Google Firebase.");
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Đang xác thực Google...';
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');
        const result = await fbAuth.signInWithPopup(provider);
        const idToken = await result.user.getIdToken(true);

        showAlert("Đang kiểm tra quyền quản trị viên...", true);
        const res = await fetch('/api/admin/login-firebase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken })
        });
        const data = await res.json();
        if (data.success) {
          showAlert(data.message || "Đăng nhập thành công!", true);
          setTimeout(() => window.location.reload(), 350);
        } else {
          showAlert(data.error || "Tài khoản không có quyền quản trị viên.");
          btn.disabled = false;
          btn.textContent = 'Đăng nhập bằng Google';
        }
      } catch (err) {
        showAlert("Lỗi đăng nhập Google: " + (err.message || err));
        btn.disabled = false;
        btn.textContent = 'Đăng nhập bằng Google';
      }
    }
  </script>
</body>
</html>

name: PAC baseline checks

on:
  pull_request:
    # Every PR base branch is tested, not just a manually maintained list.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly safety regression check after this workflow is merged to main.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: pac-baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inherited-security-tests:
    name: PAC security regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    env:
      NODE_ENV: test
      # Disposable hosted CI only; worker refuses to launch without explicit lab flag.
      PAC_WORKER_LAB_MODE: "1"
      OTTER_STRICT_WORKSPACE: "true"
      OTTER_FULL_ACCESS: "false"
      OTTER_TELEMETRY: "off"
      NO_TUNNEL: "true"
    steps:
      - name: Checkout repository (no persistent credential)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install pinned dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run inherited baseline tests (not PAC security certification)
        run: bun test tests/security.test.ts tests/oauth-security.test.ts tests/oauth.test.ts tests/pac-privacy.test.ts tests/pac-terminal-safety.test.ts tests/pac-restricted-task-engine.test.ts tests/pac-policy-check.test.ts tests/pac-permission-boundary.test.ts tests/pac-desktop-quarantine.test.ts tests/pac-worker-ipc.test.ts

      - name: Enforce PAC security policy guardrails
        run: bun scripts/pac-policy-check.ts

      - name: Bundle restricted read-only engine (compile smoke)
        run: bun build ./src/daemon/pac-restricted-task-engine.ts --target=bun --outfile pac-restricted-smoke.js

      - name: Bundle daemon entrypoint (compile smoke; do not execute)
        run: bun build ./src/daemon/index.ts --target=bun --outfile pac-daemon-smoke.js

      - name: Bundle worker entry and launcher (compile only)
        run: bun build ./src/worker/pac-windows-worker.ts ./src/worker/pac-worker-launcher.ts --target=bun --outdir pac-worker-smoke

      - name: Compile Windows lab-only worker EXE
        if: matrix.os == 'windows-latest'
        run: bun build --compile ./src/worker/pac-windows-worker.ts --outfile ./labs/pac-worker-v0/pac-worker-lab.exe

      - name: Run compiled Windows lab positive and negative IPC tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & ./labs/pac-worker-v0/run-demo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Compile native Windows Forms Alpha interface
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (!(Test-Path $compiler)) { throw 'Windows .NET Framework C# compiler unavailable' }
          & $compiler /nologo /target:winexe /platform:x64 '/out:labs\pac-worker-v0\PAC-Alpha-Lab.exe' /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll 'labs\pac-worker-v0\PAC-Alpha-Lab-GUI.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test compiled GUI launcher with real worker (no UI needed)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = (Resolve-Path './labs/pac-worker-v0/PAC-Alpha-Lab.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw ('Alpha GUI IPC self-test failed: exit ' + $process.ExitCode) }
          Write-Host 'PAC_ALPHA_GUI_SELFTEST_PASSED: compiled WinForms launcher + read-only worker'

      - name: Record reproducible Alpha artifact hashes
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = 'labs/pac-worker-v0'
          $worker = (Get-FileHash (Join-Path $dir 'pac-worker-lab.exe') -Algorithm SHA256).Hash
          $gui = (Get-FileHash (Join-Path $dir 'PAC-Alpha-Lab.exe') -Algorithm SHA256).Hash
          @(
            'PAC Alpha Lab v0.2 — unsigned, lab-only'
            ('Commit: ' + $env:GITHUB_SHA)
            ('SHA256 pac-worker-lab.exe: ' + $worker)
            ('SHA256 PAC-Alpha-Lab.exe: ' + $gui)
            'No OS sandbox, no personal file access'
          ) | Set-Content -Path (Join-Path $dir 'BUILD-MANIFEST.txt') -Encoding utf8

      - name: Upload unsigned Windows Alpha Lab preview (3 days)
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pac-alpha-lab-v02-windows
          path: |
            labs/pac-worker-v0/pac-worker-lab.exe
            labs/pac-worker-v0/PAC-Alpha-Lab.exe
            labs/pac-worker-v0/ALPHA-V02-README.md
            labs/pac-worker-v0/BUILD-MANIFEST.txt
            labs/pac-worker-v0/run-demo.ps1
            labs/pac-worker-v0/README.md
          retention-days: 3
          if-no-files-found: error
